[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dalio-machine"
version = "0.1.0"
description = "Point-in-time macro history and risk observatory for economic cycles, institutional evidence, global fundamentals, and household-investor decision support."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Adam Boman" }]
license = { text = "MIT" }
keywords = ["macro", "economics", "economic-history", "debt-cycle", "risk", "asset-allocation"]

dependencies = [
    "fredapi>=0.5.2",
    "requests>=2.32",
    "pandas>=2.2",
    "numpy>=1.26",
    "sqlalchemy>=2.0",
    "streamlit>=1.36",
    "plotly>=5.22",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "ruff>=0.5",
]

[project.scripts]
dalio-fetch-fred = "dalio.pipelines.fetch_fred:main"
dalio-fetch-bis = "dalio.pipelines.fetch_bis:main"
dalio-fetch-fundamentals = "dalio.pipelines.fetch_fundamentals:main"
dalio-fetch-cycle = "dalio.pipelines.fetch_cycle:main"
dalio-fetch-riksbank = "dalio.pipelines.fetch_riksbank:main"
dalio-fetch-debt-holders = "dalio.pipelines.fetch_debt_holders:main"
dalio-fetch-flows = "dalio.pipelines.fetch_flows:main"
dalio-fetch-positions = "dalio.pipelines.fetch_positions:main"
dalio-fetch-sovereign-debt = "dalio.pipelines.fetch_sovereign_debt:main"
dalio-fetch-commodities = "dalio.pipelines.fetch_commodities:main"
dalio-fetch-money-liquidity = "dalio.pipelines.fetch_money_liquidity:main"
dalio-fetch-shadow-liquidity = "dalio.pipelines.fetch_shadow_liquidity:main"
dalio-liquidity-brief = "dalio.pipelines.build_liquidity_brief:main"
dalio-report-review-packet = "dalio.pipelines.build_report_review_packet:main"
dalio-report-review = "dalio.pipelines.review_report_claims:main"
dalio-communication-rights-packet = "dalio.pipelines.build_communication_rights_review_packet:main"
dalio-communication-metadata-inventory = "dalio.pipelines.build_communication_metadata_inventory:main"
dalio-ingest-ap-funds = "dalio.pipelines.ingest_ap_funds:main"
dalio-ingest-reports = "dalio.pipelines.ingest_reports:main"
dalio-bootstrap-history = "dalio.pipelines.bootstrap_history:main"
dalio-audit-observatory = "dalio.storage.inventory:main"
dalio-score = "dalio.pipelines.score_fundamentals:main"
dalio-app = "dalio.app.streamlit_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

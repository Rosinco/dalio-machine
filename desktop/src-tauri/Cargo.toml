[package]
name = "macro-atlas"
version = "0.1.0"
description = "Offline macroeconomic research atlas"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
opt-level = "s"
lto = "thin"
codegen-units = 1
